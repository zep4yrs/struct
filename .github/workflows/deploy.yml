name: Build & Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structvis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: structvis/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npx prettier --check . && npx eslint .

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        # 注：视觉回归截图基线带平台后缀（*-chromium-win32.png 等）。
        # Linux CI 首次运行若因字体差异失败，用 npx playwright test -g 视觉回归 --update-snapshots
        # 在 Linux 上生成基线后提交（本地基线仅覆盖 win32）。

      - name: Build
        run: npm run build

      - name: Commit built docs
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs unchanged — nothing to commit"
          else
            git commit -m "chore: build docs [skip ci]"
            git push
          fi
