name: Desktop Build

on:
  push:
    branches: [feat/desktop-tauri]
    paths:
      - 'structvis/src/**'
      - 'structvis/static/**'
      - 'src-tauri/**'
      - 'structvis/package.json'
      - 'structvis/svelte.config.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: structvis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: structvis/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build web variant (base='')
        run: node scripts/build-app.mjs

      - name: Tauri build (exe + msi/nsis bundle)
        run: npx tauri build

      - name: Upload desktop exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructVis-desktop-exe
          path: src-tauri/target/release/structvis.exe

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructVis-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
