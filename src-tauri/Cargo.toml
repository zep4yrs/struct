[package]
name = "structvis"
version = "2.0.0"
description = "StructVis — 数据结构与数据库可视化学习工具（桌面端）"
edition = "2021"

[lib]
name = "structvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
