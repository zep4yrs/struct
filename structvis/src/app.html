<!doctype html>
<!-- 内联纸底色：首访 CSS 下载完成前的 FOUC 窗口与站点底色一致；
     下面的小脚本在 CSS 就位前同步已存档的暗色偏好（inline 底色 + dark 类），避免暗色用户首帧白闪 -->
<html lang="zh-CN" style="background: #faf9f6">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#FCFAF6" />
		<!-- 各路由自带 <title>（AlgoPage 承载 87 课题页）；此处不放全局 title 以免 SSR 输出重复标签 -->
		<!-- 分享卡片（微信/群聊/社交媒体抓取） -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="StructVis" />
		<meta property="og:title" content="StructVis — 数据结构与数据库可视化学习工具" />
		<meta
			property="og:description"
			content="87 个课题逐帧可视化：排序、树、图、SQL 每一步都能停下来看，还能换成自己的数据重演。本地运行、免费、无需登录。"
		/>
		<meta property="og:image" content="/struct/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<script>
			(function () {
				try {
					var raw = localStorage.getItem('structvis:settings');
					if (raw && raw.indexOf('"dark"') !== -1) {
						document.documentElement.style.background = '#161514';
						document.documentElement.classList.add('dark');
						document.querySelector('meta[name="theme-color"]').content = '#161514';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
